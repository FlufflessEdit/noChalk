[package]
name = "nochalk"
version = "1.7.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[lib]
name = "nochalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


