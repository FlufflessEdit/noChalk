    <div id="topbar">
      <span class="word" id="wordBtn" title="About noChalk">noChalk</span>
      <span id="paneHome"
        ><button id="paneBtn2" title="Show / hide the page list (moves into the toolbar while hidden)">
          <svg class="ic" style="width: 17px; height: 17px">
            <use href="#i-panel" />
          </svg></button
      ></span>
      <div id="topRight">
        <button class="tb" id="snapBtn" title="Snap text boxes to a 24 px grid — saved with this notebook">
          <svg class="ic">
            <use href="#i-magnet" />
          </svg>
        </button>
        <button class="tb" id="bgBtn" title="Page background: colour, ruled, squares, dots, dark — saved with this notebook">
          <svg class="ic">
            <use href="#i-pagestyle" />
          </svg>
        </button>
        <button id="themeBtn" title="Light / dark theme — saved with this notebook">
          <svg class="ic" style="width: 17px; height: 17px">
            <use href="#i-moon" />
          </svg>
        </button>
        <button class="tb" id="helpBtn" title="Open the noChalk Guide — a section inside this notebook">?</button>
        <div class="seg" id="fileSeg">
          <button class="tb" id="saveBtn" title="Save to this notebook's file — Ctrl+S. Unsaved changes show in the strip above; red after 5 minutes">
            <svg class="ic">
              <use href="#i-down" />
            </svg>
          </button>
          <button class="tb" id="loadBtn" title="Open another notebook file — the current one is saved first">
            <svg class="ic">
              <use href="#i-up" />
            </svg>
          </button>
          <button class="tb" id="newNbBtn" title="Create a new notebook — pick where its file lives; the current one is saved first">
            <svg class="ic">
              <use href="#i-plus" />
            </svg>
          </button>
        </div>
        <button id="fsBtn" title="Fullscreen">
          <svg class="ic" style="width: 16px; height: 16px">
            <use href="#i-expand" />
          </svg>
        </button>
        <button
          id="barBtn"
          title="Pin the bar: top bar and section row stay visible. Unpinned, they hide until the mouse reaches the very top — the page list and toolbar always stay. Saved with this notebook">
          <svg class="ic" style="width: 16px; height: 16px">
            <use href="#i-pin" />
          </svg>
        </button>
      </div>
    </div>

    <div id="app">
      <div id="hideStack">
        <div id="tabsRow"><button id="addSec" title="New section — name and colour">+</button></div>
      </div>

      <div id="body">
        <aside id="pagesPane">
          <div class="pane-head">
            <span class="ph-l">
              <button id="paneBtn" title="Show / hide this page list">
                <svg class="ic" style="width: 14px; height: 14px">
                  <use href="#i-panel" />
                </svg>
              </button>
              <span>Pages</span>
            </span>
            <button id="pagePasteBtn" title="Paste the copied page into this section">
              <svg class="ic" style="width: 15px; height: 15px"><use href="#i-paste" /></svg>
            </button>
            <button id="addPageBtn" title="New page">
              <svg class="ic" style="width: 15px; height: 15px">
                <use href="#i-plus" />
              </svg>
            </button>
          </div>
          <div id="pageList"></div>
        </aside>

        <main>
          <div id="toolbar">
            <span id="paneSlot"></span>
            <div class="seg" id="modeSeg">
              <button
                data-mode="select"
                class="on"
                title="Select"
                id="modeSelectBtn"
                data-tip="The default tool. Tap or click objects to work with them — move, resize, delete. Tap a text box to place the caret. Hold empty paper for about half a second to create a text box (switches to Text). Drag a rectangle around objects — or draw a freehand loop with the lasso; click the button again while active to switch between rectangle and lasso; hold or right-click to choose from a menu. Everything caught joins one temporary box: drag its handle to move it all at once, press Delete or click the red × to remove it, Esc to clear. A single click selects one object.">
                <svg class="ic">
                  <use href="#i-cursor" />
                </svg>
              </button>
              <button
                data-mode="text"
                title="Text"
                id="modeTextBtn"
                data-tip="Typing. Tap empty paper and a text box appears at once with the caret inside; holding works too. Tap an existing box to place the caret. Drag boxes by their handle, resize at any edge or corner, delete with the ×, copy with the copy button or Ctrl+C — paste with Ctrl+V or the paste button at the right end of the toolbar. Pin a box to lock it into the background and write over it. Hover a section tab or a page entry to reveal its drag handle and reorder it. When a table cell is selected, row and column buttons appear at the end of the toolbar.">
                <svg class="ic">
                  <use href="#i-text" />
                </svg>
              </button>
              <button
                data-mode="draw"
                title="Draw"
                id="modeDrawBtn"
                data-tip="Draw with mouse, stylus or finger — ink appears while the button is held. Pen and shapes render beneath the text so you can write over your drawings; the marker renders above it for highlighting. Hold Shift while drawing for a straight line. Rectangle, ellipse and triangle sit next to the pen presets: click once for outline, again for filled, a third time to deselect — Shift constrains them to square, circle or equilateral. Stylus: hold the barrel button to erase. Click the Draw button while it is active to toggle pen-only mode, where fingers pan instead of drawing. Hold or right-click it for the same setting and more. The icon shows the plain pen while pen-only is on, and a pen with a pointing hand while fingers draw too.">
                <svg class="ic">
                  <use href="#i-pen" />
                </svg>
              </button>
              <button
                data-mode="shape"
                title="Covers"
                id="modeShapeBtn"
                data-tip="Drag a rectangle over an answer and it becomes a filled cover. Click a cover to switch it between filled and dashed outline, revealing what's underneath. Hold or right-click the Covers button to change the cover colour or reset every cover on the page to filled — ready for the next class.">
                <svg class="ic">
                  <use href="#i-layers" />
                </svg>
                <span class="dotc" id="covDot" style="background: #f2c14e"></span>
              </button>
            </div>

            <div class="ribbon rb-text">
              <button class="tb" data-cmd="bold" title="Bold — Ctrl+B">
                <svg class="ic">
                  <use href="#i-bold" />
                </svg>
              </button>
              <button class="tb" data-cmd="italic" title="Italic — Ctrl+I">
                <svg class="ic">
                  <use href="#i-italic" />
                </svg>
              </button>
              <button class="tb" data-cmd="underline" title="Underline — Ctrl+U">
                <svg class="ic">
                  <use href="#i-underline" />
                </svg>
              </button>
              <button class="tb" data-cmd="strikeThrough" title="Strikethrough">
                <svg class="ic">
                  <use href="#i-strike" />
                </svg>
              </button>
              <span class="sep"></span>
              <div class="sizewrap">
                <input
                  id="sizeIn"
                  type="text"
                  inputmode="decimal"
                  placeholder="16"
                  title="Font size — with the caret alone it sets the size of what you type next; with a selection it reformats. Lists inherit the size of their first character" />
                <button id="sizeChev" title="Preset font sizes">
                  <svg class="ic" style="width: 12px; height: 12px">
                    <use href="#i-chev" />
                  </svg>
                </button>
              </div>
              <span class="sep"></span>
              <button class="tb tb-col" id="colBtn" title="Text colour">
                <span class="ag">A</span><span class="dotc" id="colDot" style="background: #1c1917"></span>
              </button>
              <button
                class="tb tb-col"
                id="hilBtn"
                title="Highlight — click to switch on: text you write and select is marked in this colour. Click again to switch off and unmark the selection. Hold or right-click to pick another colour. Marks only ever touch the exact selection — one word can carry several colours">
                <svg class="ic">
                  <use href="#i-hl" />
                </svg>
                <span class="dotc" id="hilDot" style="background: #fde68a"></span>
              </button>
              <span class="sep"></span>
              <button class="tb txt" data-cmd="subscript" title="Subscript — Ctrl+, (for H₂O)">
                <span>x<sub style="font-size: 0.65em">2</sub></span>
              </button>
              <button class="tb txt" data-cmd="superscript" title="Superscript — Ctrl+. (for x²)">
                <span>x<sup style="font-size: 0.65em">2</sup></span>
              </button>

              <span class="sep"></span>
              <button class="tb" data-cmd="justifyLeft" title="Align left">
                <svg class="ic">
                  <use href="#i-alignl" />
                </svg>
              </button>
              <button class="tb" data-cmd="justifyCenter" title="Center">
                <svg class="ic">
                  <use href="#i-alignc" />
                </svg>
              </button>
              <button class="tb" data-cmd="justifyRight" title="Align right">
                <svg class="ic">
                  <use href="#i-alignr" />
                </svg>
              </button>
              <button class="tb" data-cmd="justifyFull" title="Justify">
                <svg class="ic">
                  <use href="#i-alignj" />
                </svg>
              </button>
              <span class="sep"></span>
              <button class="tb" data-cmd="insertUnorderedList" title="Bullet list">
                <svg class="ic">
                  <use href="#i-listul" />
                </svg>
              </button>
              <button class="tb" data-cmd="insertOrderedList" title="Numbered list">
                <svg class="ic">
                  <use href="#i-listol" />
                </svg>
              </button>
              <button class="tb" id="outdBtn" title="Outdent">
                <svg class="ic">
                  <use href="#i-outdent" />
                </svg>
              </button>
              <button class="tb" id="indBtn" title="Indent (nests list items like Word)">
                <svg class="ic">
                  <use href="#i-indent" />
                </svg>
              </button>
              <span class="sep"></span>
              <button class="tb" id="tableBtn" title="Insert table — lands in its own box">
                <svg class="ic">
                  <use href="#i-table" />
                </svg>
              </button>
              <button
                class="tb txt"
                id="symBtn"
                title="Symbols — formulas, Greek, arrows, sets, chemistry and language signs. Right-click to pin favourites next to the π button">
                <span>π</span>
              </button>
              <span class="dots" id="symFavBox"></span>
              <span class="dots" id="tblSeg">
                <button class="tb" id="tRowAdd" title="Insert a row below the current row">
                  <svg class="ic" viewBox="0 0 24 24">
                    <rect x="4" y="5" width="16" height="14" rx="2" />
                    <path d="M4 10h16" />
                    <path d="M12 12.6v3.8M10.1 14.5h3.8" />
                  </svg>
                </button>
                <button class="tb" id="tRowDel" title="Delete the current row">
                  <svg class="ic" viewBox="0 0 24 24">
                    <rect x="4" y="5" width="16" height="14" rx="2" />
                    <path d="M4 10h16" />
                    <path d="M10.1 14.5h3.8" />
                  </svg>
                </button>
                <button class="tb" id="tColAdd" title="Insert a column to the right of the current column">
                  <svg class="ic" viewBox="0 0 24 24">
                    <rect x="4" y="5" width="16" height="14" rx="2" />
                    <path d="M11 5v14" />
                    <path d="M15.5 10.1v3.8M13.6 12h3.8" />
                  </svg>
                </button>
                <button class="tb" id="tColDel" title="Delete the current column">
                  <svg class="ic" viewBox="0 0 24 24">
                    <rect x="4" y="5" width="16" height="14" rx="2" />
                    <path d="M11 5v14" />
                    <path d="M13.6 12h3.8" />
                  </svg>
                </button>
                <button class="tb" id="tMerge" title="Merge the selected cells into one — drag across the cells, then click">
                  <svg class="ic" viewBox="0 0 24 24">
                    <rect x="4" y="6" width="16" height="12" rx="2" />
                    <path d="M12 6v12M4 12h16" stroke-dasharray="2.4 2.4" />
                    <circle cx="12" cy="12" r="2.7" fill="currentColor" stroke="none" />
                  </svg>
                </button>
                <button class="tb" id="tSplit" title="Split a merged cell back into single cells">
                  <svg class="ic" viewBox="0 0 24 24">
                    <rect x="4" y="6" width="16" height="12" rx="2" />
                    <path d="M12 6v12M4 12h16" />
                  </svg>
                </button>
              </span>
            </div>

            <div class="ribbon rb-draw">
              <div class="seg" id="drawToolSeg">
                <button data-tool="pen" class="on" title="Pen — presets render beneath the text">
                  <svg class="ic"><use href="#i-pen" /></svg>
                </button>
                <button data-tool="hl" title="Marker — renders above the text, for highlighting">
                  <svg class="ic"><use href="#i-hl" /></svg>
                </button>
                <button data-tool="eraser" title="Eraser — whole strokes or precise; Ctrl+Z undoes">
                  <svg class="ic">
                    <use href="#i-eraser" />
                  </svg>
                </button>
              </div>
              <div class="dots" id="presetBox"></div>
              <button
                class="tb"
                id="shapeRectBtn"
                title="Rectangle — click once: outline. Again: filled. A third click deselects. Shift makes a square. Uses the current pen colour and size">
                <svg class="ic">
                  <use href="#i-rect" />
                </svg>
              </button>
              <button
                class="tb"
                id="shapeEllipseBtn"
                title="Ellipse — click once: outline. Again: filled. A third click deselects. Shift makes a circle. Uses the current pen colour and size">
                <svg class="ic">
                  <use href="#i-ellipse" />
                </svg>
              </button>
              <button
                class="tb"
                id="shapeTriBtn"
                title="Triangle — click once: outline. Again: filled. A third click deselects. Shift makes it equilateral. Uses the current pen colour and size">
                <svg class="ic">
                  <use href="#i-tri" />
                </svg>
              </button>
              <button
                class="tb"
                id="setSqBtn"
                title="Set square — 45°/45°/90° with a true-to-scale ruler and degree ring. Drag the hole to move it, the corner handle to rotate around the 0 (Shift snaps to 15°). Strokes snap onto every edge and the arc. Hold or right-click for scale and colour — saved with this notebook. Appears centred if its saved position is off-screen">
                <svg class="ic">
                  <use href="#i-ruler" />
                </svg>
              </button>
              <button
                class="tb"
                id="compassBtn"
                title="Compass — the head shows the radius in cm; drag the ↔ handle to set it and a ruler appears. Cross arrow moves it, circular arrow rotates, pen icon draws the circle with the current pen. Appears centred if off-screen">
                <svg class="ic">
                  <use href="#i-compass" />
                </svg>
              </button>
            </div>
            <button class="tb" id="undoBtn" title="Undo — Ctrl+Z (Shift+Z redoes)">
              <svg class="ic"><use href="#i-undo" /></svg>
            </button>
          </div>

          <div id="viewport">
            <div id="mediaplane"></div>
            <div id="plane" data-bg="plain" data-dark="0">
              <div class="pg-head">
                <div id="title" contenteditable="true" spellcheck="false"></div>
                <div id="pgMeta"></div>
              </div>
            </div>
            <canvas id="ink"></canvas>
            <div id="shapes"></div>
          </div>
        </main>
      </div>
    </div>

    <div id="toasts"></div>
    <input type="file" id="fileInput" multiple style="display: none" />

    <!-- load order is significant: plain scripts sharing globals -->
    <script src="js/platform.js"></script>
    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/filesys.js"></script>
    <script src="js/model.js"></script>
    <script src="js/page.js"></script>
    <script src="js/view.js"></script>
    <script src="js/ruler.js"></script>
    <script src="js/compass.js"></script>
    <script src="js/text.js"></script>
    <script src="js/edit.js"></script>
    <script src="js/tablecols.js"></script>
    <script src="js/ink.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/covers.js"></script>
    <script src="js/select.js"></script>
    <script src="js/imports.js"></script>
    <script src="js/converter.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/guide.js"></script>
    <script src="js/tour.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
